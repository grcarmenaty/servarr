# AI assistant stack — Ollama (inference) + Open WebUI (authenticated chat
# UI + OpenAI-compatible API). Runs in the GPU-passthrough VM (docs/16).
#
# Security model:
#   - Ollama's native port 11434 has NO auth → published on 127.0.0.1 only.
#   - All LAN/VPN access goes through Open WebUI (:3000 → chat.home.lan),
#     which requires login; its /api endpoint requires per-user API keys.

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - /mnt/models/ollama:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    depends_on:
      - ollama
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      WEBUI_URL: ${WEBUI_URL:-http://chat.home.lan}
      # First run: leave signups on, create YOUR account (first user =
      # admin), then set ENABLE_SIGNUP=false in .env and `docker compose
      # up -d` again. New users are then admin-created only.
      ENABLE_SIGNUP: ${ENABLE_SIGNUP:-true}
      DEFAULT_USER_ROLE: pending
    ports:
      - "3000:8080"
    volumes:
      - /opt/ai/config/open-webui:/app/backend/data
