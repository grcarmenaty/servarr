# Cloud stack — Nextcloud (files/calendar/photos) + Firefly III (personal
# finance), runs inside the cloud VM (docs/10-cloud-stack.md).
#
#   cp .env.example .env      # bootstrap.sh generates this with secrets
#   docker compose up -d
#
# Nextcloud is built from ./nextcloud/Dockerfile (adds the SMB client so it
# can mount the servarr media share as external storage).

services:
  # ── shared database (nextcloud + firefly, separate DBs/users) ──────────
  db:
    image: postgres:17
    container_name: cloud-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      FIREFLY_DB_PASSWORD: ${FIREFLY_DB_PASSWORD}
    volumes:
      - ${CONFIG_ROOT}/postgres:/var/lib/postgresql/data
      - ./init-dbs.sh:/docker-entrypoint-initdb.d/init-dbs.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextcloud"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cloud-redis
    restart: unless-stopped

  # ── Nextcloud ──────────────────────────────────────────────────────────
  nextcloud:
    build: ./nextcloud
    image: nextcloud-smb:local
    container_name: nextcloud
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      NEXTCLOUD_TRUSTED_DOMAINS: ${NEXTCLOUD_TRUSTED_DOMAINS}
      TRUSTED_PROXIES: ${CADDY_IP}
      PHP_UPLOAD_LIMIT: 16G
      PHP_MEMORY_LIMIT: 1G
    ports:
      - "8080:80"
    volumes:
      - ${CONFIG_ROOT}/nextcloud/html:/var/www/html
      - ${DATA_ROOT}/nextcloud:/var/www/html/data

  # background jobs (same image, cron entrypoint) — required for reliable
  # file scanning, previews, and calendar reminders
  nextcloud-cron:
    image: nextcloud-smb:local
    container_name: nextcloud-cron
    restart: unless-stopped
    entrypoint: /cron.sh
    depends_on:
      - nextcloud
    volumes:
      - ${CONFIG_ROOT}/nextcloud/html:/var/www/html
      - ${DATA_ROOT}/nextcloud:/var/www/html/data

  # ── Firefly III (personal finance) ─────────────────────────────────────
  firefly:
    image: fireflyiii/core:latest
    container_name: firefly
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_KEY: ${FIREFLY_APP_KEY}
      APP_URL: http://money.home.lan
      TRUSTED_PROXIES: "**"
      TZ: ${TZ:-Etc/UTC}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: firefly
      DB_USERNAME: firefly
      DB_PASSWORD: ${FIREFLY_DB_PASSWORD}
    ports:
      - "8082:8080"
    volumes:
      - ${CONFIG_ROOT}/firefly/upload:/var/www/html/storage/upload

  # CSV/bank-statement importer for Firefly
  firefly-importer:
    image: fireflyiii/data-importer:latest
    container_name: firefly-importer
    restart: unless-stopped
    depends_on:
      - firefly
    environment:
      FIREFLY_III_URL: http://firefly:8080
      VANITY_URL: http://money.home.lan
      TZ: ${TZ:-Etc/UTC}
    ports:
      - "8081:8080"
