# cloud-data VM — shared state for the Nextcloud app pair, plus Firefly III.
# (docs/10-cloud-stack.md)
#
# Postgres and Redis are published on the LAN for the two app VMs; the
# Nextcloud html/data directories are exported over NFS by the VM itself
# (set up by bootstrap.sh, not a container).

services:
  db:
    image: postgres:17
    container_name: cloud-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      FIREFLY_DB_PASSWORD: ${FIREFLY_DB_PASSWORD}
      PAPERLESS_DB_PASSWORD: ${PAPERLESS_DB_PASSWORD}
      GUACAMOLE_DB_PASSWORD: ${GUACAMOLE_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - ${CONFIG_ROOT}/postgres:/var/lib/postgresql/data
      - ./init-dbs.sh:/docker-entrypoint-initdb.d/init-dbs.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextcloud"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Valkey (BSD-3, Linux Foundation) instead of Redis: Redis 7.4+ moved to
  # non-open-source licenses (RSALv2/SSPL). Protocol-identical drop-in.
  redis:
    image: valkey/valkey:8-alpine
    container_name: cloud-valkey
    restart: unless-stopped
    command: valkey-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"

  # ── SearXNG (private metasearch — search.home.lan) ─────────────────────
  # Aggregates results from many engines; no tracking, no profiling.
  # Also serves as Open WebUI's web-search backend (docs/16).
  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    environment:
      SEARXNG_BASE_URL: http://search.home.lan/
      SEARXNG_SECRET: ${SEARXNG_SECRET}
    ports:
      - "8083:8080"
    volumes:
      - ${CONFIG_ROOT}/searxng:/etc/searxng

  # ── Karakeep (bookmarks / read-it-later, AI tagging — docs/10) ─────────
  karakeep:
    image: ghcr.io/karakeep-app/karakeep:release
    container_name: karakeep
    restart: unless-stopped
    depends_on:
      - meilisearch
      - chrome
    environment:
      DATA_DIR: /data
      MEILI_ADDR: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      BROWSER_WEB_URL: http://chrome:9222
      NEXTAUTH_URL: http://bookmarks.home.lan
      NEXTAUTH_SECRET: ${KARAKEEP_NEXTAUTH_SECRET}
      DISABLE_SIGNUPS: "false"   # create your account, then flip to true
      # AI tagging via the authenticated Open WebUI endpoint (docs/16):
      # OPENAI_BASE_URL: http://10.0.0.27:3000/api
      # OPENAI_API_KEY: <an Open WebUI API key>
      # INFERENCE_TEXT_MODEL: qwen3:8b
    ports:
      - "8086:3000"
    volumes:
      - ${CONFIG_ROOT}/karakeep:/data

  chrome:
    image: gcr.io/zenika-hub/alpine-chrome:latest
    container_name: karakeep-chrome
    restart: unless-stopped
    command:
      - --no-sandbox
      - --disable-gpu
      - --disable-dev-shm-usage
      - --remote-debugging-address=0.0.0.0
      - --remote-debugging-port=9222
      - --hide-scrollbars

  meilisearch:
    image: getmeili/meilisearch:v1.13
    container_name: karakeep-meilisearch
    restart: unless-stopped
    environment:
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
    volumes:
      - ${CONFIG_ROOT}/meilisearch:/meili_data

  # ── household apps (docs/10 has each one's first-run note) ─────────────
  grocy: # groceries, chores, expiry dates
    image: lscr.io/linuxserver/grocy:latest
    container_name: grocy
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: ${TZ:-Etc/UTC}
    ports:
      - "8087:80"
    volumes:
      - ${CONFIG_ROOT}/grocy:/config

  mealie: # recipes + meal planning
    image: ghcr.io/mealie-recipes/mealie:latest
    container_name: mealie
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Etc/UTC}
      BASE_URL: http://recipes.home.lan
      ALLOW_SIGNUP: "false"
    ports:
      - "8088:9000"
    volumes:
      - ${CONFIG_ROOT}/mealie:/app/data

  homebox: # home inventory
    image: ghcr.io/sysadminsmedia/homebox:latest
    container_name: homebox
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Etc/UTC}
      HBOX_OPTIONS_ALLOW_REGISTRATION: "true"   # first signup, then flip off
    ports:
      - "7745:7745"
    volumes:
      - ${CONFIG_ROOT}/homebox:/data

  freshrss: # RSS reader
    image: lscr.io/linuxserver/freshrss:latest
    container_name: freshrss
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: ${TZ:-Etc/UTC}
    ports:
      - "8089:80"
    volumes:
      - ${CONFIG_ROOT}/freshrss:/config

  archivebox: # permanent local archive of web pages
    image: archivebox/archivebox:latest
    container_name: archivebox
    restart: unless-stopped
    command: server --quick-init 0.0.0.0:8000
    environment:
      TZ: ${TZ:-Etc/UTC}
    ports:
      - "8090:8000"
    volumes:
      - ${CONFIG_ROOT}/archivebox:/data

  # ── BookStack (household wiki) ──────────────────────────────────────────
  bookstack:
    image: lscr.io/linuxserver/bookstack:latest
    container_name: bookstack
    restart: unless-stopped
    depends_on:
      - bookstack-db
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: ${TZ:-Etc/UTC}
      APP_URL: http://wiki.home.lan
      APP_KEY: ${BOOKSTACK_APP_KEY}
      DB_HOST: bookstack-db
      DB_PORT: "3306"
      DB_USERNAME: bookstack
      DB_PASSWORD: ${BOOKSTACK_DB_PASSWORD}
      DB_DATABASE: bookstackapp
    ports:
      - "8091:80"
    volumes:
      - ${CONFIG_ROOT}/bookstack:/config

  bookstack-db:
    image: mariadb:11
    container_name: bookstack-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${BOOKSTACK_DB_PASSWORD}
      MYSQL_DATABASE: bookstackapp
      MYSQL_USER: bookstack
      MYSQL_PASSWORD: ${BOOKSTACK_DB_PASSWORD}
    volumes:
      - ${CONFIG_ROOT}/bookstack-db:/var/lib/mysql

  # ── Matrix family chat (Conduit server + Element web client) ───────────
  conduit:
    image: matrixconduit/matrix-conduit:latest
    container_name: conduit
    restart: unless-stopped
    environment:
      CONDUIT_SERVER_NAME: matrix.home.lan
      CONDUIT_DATABASE_BACKEND: rocksdb
      CONDUIT_ADDRESS: 0.0.0.0
      CONDUIT_PORT: "6167"
      CONDUIT_ALLOW_REGISTRATION: "true"
      CONDUIT_REGISTRATION_TOKEN: ${MATRIX_REGISTRATION_TOKEN}
      CONDUIT_ALLOW_FEDERATION: "false"   # family chat, LAN/VPN only
    ports:
      - "8092:6167"
    volumes:
      - ${CONFIG_ROOT}/conduit:/var/lib/matrix-conduit

  element:
    image: vectorim/element-web:latest
    container_name: element
    restart: unless-stopped
    depends_on:
      - conduit
    ports:
      - "8093:80"
    volumes:
      - ${CONFIG_ROOT}/element/config.json:/app/config.json:ro

  # ── Apache Guacamole (browser remote-desktop portal — docs/15) ─────────
  guacd:
    image: guacamole/guacd:latest
    container_name: guacd
    restart: unless-stopped

  guacamole:
    image: guacamole/guacamole:latest
    container_name: guacamole
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      guacd:
        condition: service_started
    environment:
      GUACD_HOSTNAME: guacd
      POSTGRESQL_HOSTNAME: db
      POSTGRESQL_DATABASE: guacamole
      POSTGRESQL_USERNAME: guacamole
      POSTGRESQL_PASSWORD: ${GUACAMOLE_DB_PASSWORD}
      WEBAPP_CONTEXT: ROOT
    ports:
      - "8085:8080"

  # ── Paperless-ngx (document archive: scan, OCR, search) ────────────────
  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    container_name: paperless
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      PAPERLESS_REDIS: redis://:${REDIS_PASSWORD}@redis:6379
      PAPERLESS_DBHOST: db
      PAPERLESS_DBNAME: paperless
      PAPERLESS_DBUSER: paperless
      PAPERLESS_DBPASS: ${PAPERLESS_DB_PASSWORD}
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY}
      PAPERLESS_URL: http://paperless.home.lan
      PAPERLESS_TIME_ZONE: ${TZ:-Etc/UTC}
      PAPERLESS_OCR_LANGUAGE: ${PAPERLESS_OCR_LANGUAGE:-eng}
      PAPERLESS_OCR_LANGUAGES: ${PAPERLESS_OCR_LANGUAGES:-}
      PAPERLESS_ADMIN_USER: admin
      PAPERLESS_ADMIN_PASSWORD: ${PAPERLESS_ADMIN_PASSWORD}
    ports:
      - "8000:8000"
    volumes:
      - ${CONFIG_ROOT}/paperless/data:/usr/src/paperless/data
      - /mnt/clouddata/paperless/media:/usr/src/paperless/media
      - /mnt/clouddata/paperless/export:/usr/src/paperless/export
      - /mnt/clouddata/paperless/consume:/usr/src/paperless/consume

  # ── Firefly III (personal finance — single instance lives here) ────────
  firefly:
    image: fireflyiii/core:latest
    container_name: firefly
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_KEY: ${FIREFLY_APP_KEY}
      APP_URL: http://money.home.lan
      TRUSTED_PROXIES: "**"
      TZ: ${TZ:-Etc/UTC}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: firefly
      DB_USERNAME: firefly
      DB_PASSWORD: ${FIREFLY_DB_PASSWORD}
    ports:
      - "8082:8080"
    volumes:
      - ${CONFIG_ROOT}/firefly/upload:/var/www/html/storage/upload

  # Bank connectivity lives here: Enable Banking (thousands of EEA banks,
  # incl. Revolut), legacy GoCardless, and CSV — see docs/10 "Connecting
  # your banks". A host cron job hits /autoimport daily (bootstrap.sh).
  firefly-importer:
    image: fireflyiii/data-importer:latest
    container_name: firefly-importer
    restart: unless-stopped
    depends_on:
      - firefly
    environment:
      FIREFLY_III_URL: http://firefly:8080
      VANITY_URL: http://money.home.lan
      TZ: ${TZ:-Etc/UTC}
      # Personal Access Token (Firefly → Options → Profile → OAuth) —
      # required for scheduled auto-imports; UI-driven imports work without
      FIREFLY_III_ACCESS_TOKEN: ${FIREFLY_ACCESS_TOKEN:-}
      # Enable Banking — primary provider
      ENABLE_BANKING_APP_ID: ${ENABLE_BANKING_APP_ID:-}
      ENABLE_BANKING_PRIVATE_KEY_FILE: ${ENABLE_BANKING_PRIVATE_KEY_FILE:-}
      ENABLE_BANKING_IMPORT_IP: autodetect
      # GoCardless — legacy, only if you already hold an account
      NORDIGEN_ID: ${NORDIGEN_ID:-}
      NORDIGEN_KEY: ${NORDIGEN_KEY:-}
      RESPOND_TO_GOCARDLESS_LIMIT: wait
      # Scheduled imports of saved import configs in /import
      AUTO_IMPORT_SECRET: ${AUTO_IMPORT_SECRET}
      CAN_POST_AUTOIMPORT: "true"
      IMPORT_DIR_ALLOWLIST: /import
    ports:
      - "8081:8080"
    volumes:
      - ${CONFIG_ROOT}/firefly-importer/keys:/keys:ro
      - ${CONFIG_ROOT}/firefly-importer/import:/import
