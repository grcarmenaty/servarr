# Servarr media stack — runs inside the servarr VM (docs/08-servarr-stack.md).
#
#   cp .env.example .env   # edit first
#   docker compose up -d
#
# With a VPN in front of the torrent client:
#   docker compose -f docker-compose.yml -f docker-compose.vpn.yml up -d
#
# Path layout follows TRaSH-guides: one /data filesystem so imports are
# instant hardlinks, never copies:
#   /data/torrents/{movies,tv,music}   downloads land here
#   /data/media/{movies,tv,music}      libraries live here

x-common: &common
  restart: unless-stopped
  environment: &common-env
    PUID: ${PUID:-1000}
    PGID: ${PGID:-1000}
    TZ: ${TZ:-Etc/UTC}

services:
  # ── media server ──────────────────────────────────────────────────────
  jellyfin:
    <<: *common
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    ports:
      - "8096:8096"
    volumes:
      - ${CONFIG_ROOT}/jellyfin:/config
      - ${DATA_ROOT}/media:/data/media

  # ── audiobooks & podcasts ─────────────────────────────────────────────
  audiobookshelf:
    restart: unless-stopped
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audiobookshelf
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      TZ: ${TZ:-Etc/UTC}
    ports:
      - "13378:80"
    volumes:
      - ${CONFIG_ROOT}/audiobookshelf:/config
      - ${CONFIG_ROOT}/audiobookshelf-metadata:/metadata
      - ${DATA_ROOT}/media/audiobooks:/audiobooks
      - ${DATA_ROOT}/media/podcasts:/podcasts

  # ── ebooks, comics & manga ────────────────────────────────────────────
  kavita:
    <<: *common
    image: jvmilazz0/kavita:latest
    container_name: kavita
    ports:
      - "5000:5000"
    volumes:
      - ${CONFIG_ROOT}/kavita:/kavita/config
      - ${DATA_ROOT}/media/books:/books
      - ${DATA_ROOT}/media/comics:/comics

  # ── request management (users ask for movies/shows here) ─────────────
  jellyseerr:
    <<: *common
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    environment:
      TZ: ${TZ:-Etc/UTC}
    ports:
      - "5055:5055"
    volumes:
      - ${CONFIG_ROOT}/jellyseerr:/app/config

  # ── the *arrs ─────────────────────────────────────────────────────────
  sonarr: # TV
    <<: *common
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    ports:
      - "8989:8989"
    volumes:
      - ${CONFIG_ROOT}/sonarr:/config
      - ${DATA_ROOT}:/data

  radarr: # movies
    <<: *common
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    ports:
      - "7878:7878"
    volumes:
      - ${CONFIG_ROOT}/radarr:/config
      - ${DATA_ROOT}:/data

  lidarr: # music
    <<: *common
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    ports:
      - "8686:8686"
    volumes:
      - ${CONFIG_ROOT}/lidarr:/config
      - ${DATA_ROOT}:/data

  prowlarr: # indexer manager
    <<: *common
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    ports:
      - "9696:9696"
    volumes:
      - ${CONFIG_ROOT}/prowlarr:/config

  # ── books & comics automation ─────────────────────────────────────────
  lazylibrarian: # books + audiobooks + magazines (the Readarr substitute)
    <<: *common
    image: lscr.io/linuxserver/lazylibrarian:latest
    container_name: lazylibrarian
    ports:
      - "5299:5299"
    volumes:
      - ${CONFIG_ROOT}/lazylibrarian:/config
      - ${DATA_ROOT}:/data

  kapowarr: # comics — monitors volumes, fetches issues into the Kavita library
    restart: unless-stopped
    image: mrcas/kapowarr:latest
    container_name: kapowarr
    environment:
      TZ: ${TZ:-Etc/UTC}
    ports:
      - "5656:5656"
    volumes:
      - ${CONFIG_ROOT}/kapowarr:/app/db
      - ${DATA_ROOT}/torrents/comics:/app/temp_downloads
      - ${DATA_ROOT}/media/comics:/comics-1

  # whisparr: # the adult-content *arr — uncomment if that's your thing
  #   <<: *common
  #   image: ghcr.io/hotio/whisparr:latest
  #   container_name: whisparr
  #   ports:
  #     - "6969:6969"
  #   volumes:
  #     - ${CONFIG_ROOT}/whisparr:/config
  #     - ${DATA_ROOT}:/data
  # (there is NO readarr: it was retired upstream in 2025 — see docs/08)

  bazarr: # subtitles
    <<: *common
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    ports:
      - "6767:6767"
    volumes:
      - ${CONFIG_ROOT}/bazarr:/config
      - ${DATA_ROOT}/media:/data/media

  # ── download client ───────────────────────────────────────────────────
  # This image runs qbittorrent-nox — the headless daemon. No X/desktop
  # inside; the web UI on :8080 IS the interface. Verify anytime with:
  #   docker exec qbittorrent ps aux | grep qbittorrent-nox
  qbittorrent:
    <<: *common
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      <<: *common-env
      WEBUI_PORT: "8080"
    ports:
      - "8080:8080"
      - "6881:6881"
      - "6881:6881/udp"
    volumes:
      - ${CONFIG_ROOT}/qbittorrent:/config
      - ${DATA_ROOT}/torrents:/data/torrents

  # ── optional companions (uncomment after first-run: both need API keys
  #    from the *arrs' Settings → General; put them in .env) ──────────────
  # unpackerr: # auto-extracts rar'd downloads so imports never stall
  #   restart: unless-stopped
  #   image: golift/unpackerr:latest
  #   container_name: unpackerr
  #   user: "${PUID:-1000}:${PGID:-1000}"
  #   environment:
  #     TZ: ${TZ:-Etc/UTC}
  #     UN_SONARR_0_URL: http://sonarr:8989
  #     UN_SONARR_0_API_KEY: ${SONARR_API_KEY}
  #     UN_RADARR_0_URL: http://radarr:7878
  #     UN_RADARR_0_API_KEY: ${RADARR_API_KEY}
  #     UN_LIDARR_0_URL: http://lidarr:8686
  #     UN_LIDARR_0_API_KEY: ${LIDARR_API_KEY}
  #   volumes:
  #     - ${DATA_ROOT}/torrents:/data/torrents
  #
  # recyclarr: # syncs TRaSH-guides quality profiles into sonarr/radarr
  #   restart: unless-stopped
  #   image: ghcr.io/recyclarr/recyclarr:latest
  #   container_name: recyclarr
  #   user: "${PUID:-1000}:${PGID:-1000}"
  #   environment:
  #     TZ: ${TZ:-Etc/UTC}
  #   volumes:
  #     - ${CONFIG_ROOT}/recyclarr:/config
  #   # then: docker exec recyclarr recyclarr config create, edit
  #   # /config/recyclarr.yml with the sonarr/radarr URLs + API keys

  # ── helper: solves Cloudflare challenges for Prowlarr indexers ────────
  flaresolverr:
    restart: unless-stopped
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      TZ: ${TZ:-Etc/UTC}
    ports:
      - "8191:8191"
