# VPN overlay — routes ALL qBittorrent traffic through a gluetun VPN
# container, preconfigured for Proton VPN.
# Optional but strongly recommended for torrenting.
#
#   docker compose -f docker-compose.yml -f docker-compose.vpn.yml up -d
#
# Fill in the PROTON_* variables in .env first. Full provider reference:
# https://github.com/qdm12/gluetun-wiki/blob/main/setup/providers/protonvpn.md
#
# With this overlay active, qBittorrent shares gluetun's network namespace —
# the *arrs must point their download client at host "gluetun" port 8080
# (NOT "qbittorrent"). NZBGet (Usenet) is NOT tunnelled — it isn't P2P.

services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      TZ: ${TZ:-Etc/UTC}
      # ── Proton VPN ─────────────────────────────────────────────────────
      VPN_SERVICE_PROVIDER: protonvpn
      VPN_TYPE: wireguard
      # Generate a WireGuard config in the Proton dashboard (Downloads →
      # WireGuard): tick "NAT-PMP (Port Forwarding)", pick a P2P server, and
      # copy the private key — it's shown ONLY at creation. See docs/08.
      WIREGUARD_PRIVATE_KEY: ${PROTON_WG_PRIVATE_KEY}
      # Server selection (Proton uses country/city names):
      SERVER_COUNTRIES: ${PROTON_COUNTRIES:-Netherlands}
      # ── port forwarding via NAT-PMP (better torrent connectivity) ──────
      VPN_PORT_FORWARDING: ${PROTON_PORT_FORWARDING:-on}
      VPN_PORT_FORWARDING_PROVIDER: protonvpn
      VPN_PORT_FORWARDING_STATUS_FILE: /gluetun/forwarded_port
      # only connect to servers that actually support port forwarding:
      PORT_FORWARD_ONLY: ${PROTON_PORT_FORWARDING:-on}
      # kill switch is gluetun's default: if the tunnel drops, traffic stops.
      # Allow the LAN so the web UIs stay reachable while tunnelled:
      FIREWALL_OUTBOUND_SUBNETS: 10.0.0.0/24
    ports:
      # qBittorrent's web UI + BitTorrent ports are published via gluetun
      - "8080:8080"
      - "6881:6881"
      - "6881:6881/udp"
    volumes:
      - ${CONFIG_ROOT}/gluetun:/gluetun
    healthcheck:
      test: ["CMD", "wget", "-qO-", "https://ipinfo.io/ip"]
      interval: 1m
      timeout: 20s
      retries: 3

  qbittorrent:
    network_mode: "service:gluetun"
    ports: !reset []
    depends_on:
      gluetun:
        condition: service_healthy

  # ── Proton port-forward → qBittorrent auto-sync (optional, recommended) ─
  # Proton keeps the forwarded port stable, but it changes if the tunnel
  # drops or gluetun restarts. gluetun writes it to /gluetun/forwarded_port;
  # this tiny sidecar reads it and sets qBittorrent's listen port via its
  # WebUI API whenever it changes.
  # REQUIRES: in qBittorrent → Options → Web UI, tick "Bypass authentication
  # for clients on localhost" (the sidecar shares gluetun's loopback).
  qbt-port-sync:
    image: alpine:latest
    container_name: qbt-port-sync
    restart: unless-stopped
    network_mode: "service:gluetun"
    depends_on:
      qbittorrent:
        condition: service_started
    volumes:
      - ${CONFIG_ROOT}/gluetun:/gluetun:ro
      - ./vpn-port-sync.sh:/port-sync.sh:ro
    entrypoint: ["sh", "/port-sync.sh"]
