# VPN overlay — routes ALL qBittorrent traffic through a gluetun VPN
# container. Optional but strongly recommended for torrenting.
#
#   docker compose -f docker-compose.yml -f docker-compose.vpn.yml up -d
#
# Fill in the VPN_* / WIREGUARD_* variables in .env first. Provider-specific
# settings: https://github.com/qdm12/gluetun-wiki
#
# Note: with this overlay active, qBittorrent shares gluetun's network —
# other containers (Sonarr/Radarr/Prowlarr) must point their download
# client at host "gluetun" port 8080, not "qbittorrent".

services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      TZ: ${TZ:-Etc/UTC}
      VPN_SERVICE_PROVIDER: ${VPN_SERVICE_PROVIDER}
      VPN_TYPE: ${VPN_TYPE:-wireguard}
      WIREGUARD_PRIVATE_KEY: ${WIREGUARD_PRIVATE_KEY:-}
      WIREGUARD_ADDRESSES: ${WIREGUARD_ADDRESSES:-}
      SERVER_COUNTRIES: ${VPN_SERVER_COUNTRIES:-}
      # kill switch is gluetun's default: if the VPN drops, traffic stops
    ports:
      # qBittorrent's ports are published via gluetun
      - "8080:8080"
      - "6881:6881"
      - "6881:6881/udp"
    volumes:
      - ${CONFIG_ROOT}/gluetun:/gluetun

  qbittorrent:
    network_mode: "service:gluetun"
    ports: !reset []
    depends_on:
      gluetun:
        condition: service_healthy
